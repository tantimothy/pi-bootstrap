# Display order for deploy.sh's Environments submenu, grouped by what each
# environment actually does rather than filesystem/inode order (which is
# arbitrary and varies between clones). Each category becomes a submenu in
# deploy.sh's Environments menu.
#
# An environment folder not listed under any category here is appended
# alphabetically under an "Other" submenu by deploy.sh's fallback pass — it
# is never silently hidden from the menu just because this file was not updated.
categories:
  - id: setup
    name: "Host Setup"
    environments:
      - pi-barebones
      - mac-terminal-setup
  - id: ai
    name: "AI Assistants"
    environments:
      - nanoclaw-mnemon
      - chat-frontends
      - llm-gateways
      - claude-cli
      - codex-cli
      - aider
  - id: network-security
    name: "Networking & Security"
    environments:
      - pihole-wireguard
      - ntopng
      - internet-pi
      - dragonos-sdr
      - kali-pentest
  - id: management
    name: "Management"
    environments:
      - portainer
  - id: retro-computing
    name: "Retro Computing"
    environments:
      - macintoshpi
      - infinite-mac
      - classic-mac-vnc
