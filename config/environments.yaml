# Display order for deploy.sh's Environments submenu, grouped by what each
# environment actually does rather than filesystem/inode order (which is
# arbitrary and varies between clones). Each category becomes a submenu in
# deploy.sh's Environments menu.
#
# An environment folder not listed under any category here is appended
# alphabetically under an "Other" submenu by deploy.sh's fallback pass — it
# is never silently hidden from the menu just because this file was not
# updated.
#
# The AI-related categories below are grouped by WHAT YOU DO WITH THE TOOL,
# not by vendor. Grouping by vendor stopped scaling once "AI Assistants"
# held a dozen entries mixing an SSH-in coding CLI, an always-on channel
# bot and an MCP proxy in one flat list. The four groups are:
#
#   Coding CLIs             — ssh in, land in tmux, write code
#   Personal Agent Platforms — always on, channel-connected, persistent memory
#   Model & Routing          — the inference plumbing everything above consumes
#   Agent Control            — orchestration over all of it
#
# See docs/future-enhancements/agent-control-environments.md for the full
# reasoning, and for why "Agent Control" rather than "Client Tools" (the
# Pi can be the client, so a name built around "not the Pi" is wrong).
categories:
  - id: setup
    name: "Host Setup"
    environments:
      - pi-barebones
      - mac-terminal-setup
  - id: coding-clis
    name: "Coding CLIs"
    environments:
      - claude-cli
      - codex-cli
      - aider
      - opencode
      - omp
      - pi
  - id: agent-platforms
    name: "Personal Agent Platforms"
    environments:
      - openclaw
      - nanoclaw-mnemon
      - hermes
  - id: model-routing
    name: "Model & Routing"
    environments:
      - ollama
      - llm-gateways
      - chat-frontends
  - id: agent-control
    name: "Agent Control"
    environments:
      - executor
      - herdr-client
      - collie-client
  - id: network-security
    name: "Networking & Security"
    environments:
      - pihole-wireguard
      - ntopng
      - internet-pi
      - dragonos-sdr
      - kali-pentest
      - metasploit
      - legion
  - id: management
    name: "Management"
    environments:
      - portainer
  - id: retro-computing
    name: "Retro Computing"
    environments:
      - macintoshpi
      - infinite-mac
      - classic-mac-vnc
