menu:
  id: ${CONTAINER_NAME:-earendil-pi-agent}
  name: "Pi Coding Agent"
  icon: utilities-terminal
deployed_check:
  kind: container
  from_compose_service: pi
entries:
  - id: pi-bootstrap-${CONTAINER_NAME:-earendil-pi-agent}
    name: "Pi Coding Agent (SSH)"
    comment: "SSH into the standalone Pi coding-agent container and attach to its persistent tmux session"
    icon: utilities-terminal
    kind: exec
    target: 'bash -c "ssh -p ${SSH_PORT:-2227} pi@localhost"'
    terminal: true
info:
  id: pi-bootstrap-${CONTAINER_NAME:-earendil-pi-agent}-info
  name: "Pi Coding Agent Info"
