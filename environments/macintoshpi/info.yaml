data_dirs: []
install_dirs:
  - path: "/usr/share/macintoshpi"
    description: "Compiled emulators, Mac OS ROMs, hard disk images (macos7/8/9), VICE/CDEmu/SyncTERM binaries — upstream's own hardcoded BASE_DIR"
  - path: "/etc/macintoshpi"
    description: "MacintoshPi Launcher's per-resolution config.txt/rc.local overlays — upstream's own hardcoded CONF_DIR"
  - path: "${SCRIPT_DIR}/src/MacintoshPi"
    description: "Vendored clone of the MacintoshPi build scripts (re-fetched fresh on every FAST/CLEAN install — safe to delete)"
install_dirs_label: "📂 Installed Files (upstream's own fixed paths — not relocatable without patching MacintoshPi itself):"
delete_install_dirs: true
delete_confirm_msg: "This deletes every compiled emulator AND every Mac OS hard disk image (macos7/8/9) — anything you installed inside those emulated systems will be lost. Your ~/Downloads shared folder is NOT touched."
no_data_msg: "(none — MacintoshPi only writes to the install directories below, plus your existing ~/Downloads as a shared Unix folder with the emulated Mac OS systems)"
no_delete_msg: "MacintoshPi has not been installed (FAST installs it first)."
custom_actions:
  - label: "Reinstall Mac OS 9 only (SheepShaver)"
    command: 'bash -c "[ -d ${ENV_DIR}/src/MacintoshPi/macos9 ] && (cd ${ENV_DIR}/src/MacintoshPi/macos9 && ./macos9.sh) || echo Run FAST first to fetch the MacintoshPi source."'
  - label: "Reinstall Mac OS 8 only (Basilisk II)"
    command: 'bash -c "[ -d ${ENV_DIR}/src/MacintoshPi/macos8 ] && (cd ${ENV_DIR}/src/MacintoshPi/macos8 && ./macos8.sh) || echo Run FAST first to fetch the MacintoshPi source."'
  - label: "Reinstall Mac OS 7 only (Basilisk II)"
    command: 'bash -c "[ -d ${ENV_DIR}/src/MacintoshPi/macos7 ] && (cd ${ENV_DIR}/src/MacintoshPi/macos7 && ./macos7.sh) || echo Run FAST first to fetch the MacintoshPi source."'
  - label: "Reinstall VICE (Commodore 64/128/PET)"
    command: 'bash -c "[ -d ${ENV_DIR}/src/MacintoshPi/vice ] && (cd ${ENV_DIR}/src/MacintoshPi/vice && ./vice.sh) || echo Run FAST first to fetch the MacintoshPi source."'
  - label: "Reinstall CDEmu (CD/DVD image mounting)"
    command: 'bash -c "[ -d ${ENV_DIR}/src/MacintoshPi/cdemu ] && (cd ${ENV_DIR}/src/MacintoshPi/cdemu && ./cdemu.sh) || echo Run FAST first to fetch the MacintoshPi source."'
  - label: "Reinstall Virtual Modem (telnet BBS)"
    command: 'bash -c "[ -d ${ENV_DIR}/src/MacintoshPi/vmodem ] && (cd ${ENV_DIR}/src/MacintoshPi/vmodem && ./vmodem.sh) || echo Run FAST first to fetch the MacintoshPi source."'
  - label: "Reinstall SyncTERM (BBS terminal)"
    command: 'bash -c "[ -d ${ENV_DIR}/src/MacintoshPi/syncterm ] && (cd ${ENV_DIR}/src/MacintoshPi/syncterm && ./syncterm.sh) || echo Run FAST first to fetch the MacintoshPi source."'
# |2 pins the strip to exactly 2 spaces — see ntopng/info.yaml for why an
# explicit indicator is needed rather than a plain "|".
useful_commands: |2
     mac os9                          # Launch Mac OS 9 (SheepShaver) full-screen — CTRL+SHIFT+ESC to quit
     mac os8                          # Launch Mac OS 8 (Basilisk II)
     mac os7                          # Launch Mac OS 7 / System 7.5.5 (Basilisk II)
     mac os9 file.img                 # Launch with an extra .img/.dsk mounted as a second drive
     mac os9-768                      # Reboot into 768-row resolution, then auto-launch Mac OS 9 (see MacintoshPi Launcher docs)

     cdload image.toast               # Mount a CD/DVD image via CDEmu (appears as /dev/sr0)
     cdunload                         # Unmount it

     ATDT bbs.example.com:6400        # From inside Mac OS/VICE's terminal software: dial a telnet BBS via the virtual modem
     sudo systemctl status vmodem     # Virtual modem service status
     sudo systemctl restart vmodem    # Restart it (needed after every kernel update — see README)
     nano /etc/vmodem.conf            # Change virtual modem speed (default 2400 bps)

     📌 Notes:
     Shared folder: ~/Downloads appears inside every Mac OS as a "Unix" drive — copy files both ways, but
     you can't launch an app directly from it.
     Software must be from before 2000 to load on the emulated ROMs — see the README for download sources.
