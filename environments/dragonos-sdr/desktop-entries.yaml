menu:
  id: dragonos-sdr
  name: "DragonOS SDR"
  icon: gqrx
deployed_check:
  # .env.example ships no persistent container_name — the environment runs
  # with --rm, so a lingering image alone doesn't prove it was ever
  # launched. run.sh touches .deployed right before it runs the container
  # instead.
  kind: marker
  value: "${ENV_DIR}/.deployed"
entries:
  - id: pi-bootstrap-gqrx
    name: "GQRX"
    comment: "Software Defined Radio receiver — spectrum waterfall, FM/AM/SSB/CW demodulation"
    icon: gqrx
    kind: exec
    # run.sh loads this environment's .env and supplies the same X11,
    # PulseAudio/PipeWire, USB and data mounts as a normal deployment.
    target: 'bash -c "cd ''${ENV_DIR}'' && bash ./run.sh --gui gqrx"'
    terminal: false
  - id: pi-bootstrap-gnuradio
    name: "GNU Radio Companion"
    comment: "Visual signal processing flowgraph editor"
    icon: gnuradio-grc
    kind: exec
    target: 'bash -c "cd ''${ENV_DIR}'' && bash ./run.sh --gui gnuradio-companion"'
    terminal: false
  - id: pi-bootstrap-sdr-menu
    name: "SDR Tools Menu"
    comment: "Interactive SDR launcher — rtl_fm, dump1090, hackrf, APRS, ACARS and more"
    icon: utilities-terminal
    kind: exec
    # Attach to a running container if available; otherwise launch one with
    # the complete host-device configuration from this environment's .env.
    target: 'bash -c "cd ''${ENV_DIR}'' && REBUILD_POLICY=FAST bash ./run.sh"'
    terminal: true
info:
  id: pi-bootstrap-dragonos-sdr-info
  name: "DragonOS SDR Info"
