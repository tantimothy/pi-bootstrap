# Static LiteLLM proxy config, committed directly (no secrets live here —
# see docker-compose.yml's bind mount comment for why a real file instead
# of a `.example` copy-first pattern). Actual credentials are resolved from
# environment variables at container start via LiteLLM's own `os.environ/...`
# syntax, so editing which providers are enabled only ever touches `.env`,
# never this file.
model_list:
  # Wildcard entry — proxies every model your host's Ollama already has
  # pulled, under its own name, with no per-model list to maintain here.
  - model_name: ollama/*
    litellm_params:
      model: ollama/*
      api_base: os.environ/OLLAMA_BASE_URL

  # Uncomment to add a hosted provider alongside your local Ollama models —
  # set the matching *_API_KEY in .env first. LiteLLM exposes every
  # model_name below through the same OpenAI-compatible
  # /v1/chat/completions endpoint, so callers don't need to know which
  # backend actually served a given request.
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # Current Claude lineup — enabled by default (unlike the OpenAI example
  # above) since a caller picking a Claude model here is the common case
  # this repo's own environments (aider, and claude-cli's point-to-gateway.sh)
  # actually use this for. Requesting any of these without ANTHROPIC_API_KEY
  # set in .env fails at call time with an auth error — LiteLLM itself
  # still starts fine either way, it's only these specific entries that
  # don't work until the key is set. Model IDs verified against Claude
  # Code's own model configuration docs
  # (https://code.claude.com/docs/en/model-config), not guessed.
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-fable-5
    litellm_params:
      model: anthropic/claude-fable-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Real, still-current pinned versions — not what `sonnet`/`opus` resolve
  # to on the Anthropic API by default (that's the 5-series above), but
  # exactly what those aliases currently resolve to on other providers
  # (Claude Platform on AWS: Sonnet 4.6; Microsoft Foundry: Opus 4.6/Sonnet
  # 4.5 — see the same model configuration docs cited above), and directly
  # nameable on the Anthropic API too if you specifically want one of these
  # instead of whatever "current" resolves to over time. Same
  # ANTHROPIC_API_KEY requirement as the four above.
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
