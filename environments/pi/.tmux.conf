# Esc-key latency — see pi-barebones/.tmux.conf for the full reasoning.
set -s escape-time 10
set -g status on
set -g status-position bottom
set -g status-style fg=white,bg=black
set-window-option -g window-status-format "#[fg=cyan,bg=black] #I #W "
set-window-option -g window-status-current-format "#[fg=black,bg=cyan,bold] #I #W "
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_current_command}"
set-window-option -g automatic-rename on
set-option -g allow-rename on
set-window-option -g automatic-rename-format "#{P:#{pane_index}-#{pane_current_command} } (#P)"
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind c new-window -c "#{pane_current_path}"
bind -r C-k resize-pane -D 15
bind -r C-i resize-pane -U 15
bind -r C-j resize-pane -L 15
bind -r C-l resize-pane -R 15
bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'

# Forward the inner application's OSC title outward, so a terminal OUTSIDE
# this container can see it.
#
# This is not cosmetic. herdr-client's agent-state sidebar detects
# blocked/working/idle by matching the RENDERED SCREEN plus OSC title and
# progress sequences — verified in herdr's src/detect/manifests/*.toml.
# Screen rules cross this container's tmux fine, because the bytes reach the
# outer pane either way. OSC TITLE RULES DO NOT: tmux owns the outer title
# and by default reports itself, so those rules silently never fire.
#
# It is a minority of rules but not a trivial one — claude has 2 of 16 and
# codex 3 of 9, including codex's highest-priority "working" signal. Without
# this, those agents look idle while they are busy.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
