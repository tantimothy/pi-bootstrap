# Executor — an MCP gateway. One endpoint fronting every integration, with
# credentials held server-side and per-tool allow / require-approval / block.
# Agents point at it instead of each holding its own copy of every token.
#
# Single container: the typed API, the MCP server, Better Auth, QuickJS code
# execution and the web UI, all in one process over a libSQL (SQLite) file.
# No external database, worker or proxy.
services:
  executor:
    container_name: ${CONTAINER_NAME:-executor}
    # Registry image, multi-arch (linux/amd64 + linux/arm64), so no build and
    # no maintenance.yaml local_images entry — check-updates.sh takes its
    # normal pull-and-compare path.
    #
    # NOTE THE NAMESPACE. ghcr.io/usefulsoftwareco/ is current;
    # ghcr.io/rhyssullivan/ is the LEGACY name that releases are still
    # mirrored to. Both work today; only one is where new work lands.
    #
    # Upstream tags each release three ways: the release tag, the bare
    # version, and a channel (`latest` for stable, `beta` for prereleases).
    # A bare version is the pin worth using.
    image: ghcr.io/usefulsoftwareco/executor-selfhost:${EXECUTOR_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # The public URL browsers actually load. It MUST match scheme + host +
      # port exactly or browser logins are rejected — the single most common
      # way a working instance looks broken.
      - EXECUTOR_WEB_BASE_URL=${EXECUTOR_WEB_BASE_URL:-}
      - EXECUTOR_TRUSTED_ORIGINS=${EXECUTOR_TRUSTED_ORIGINS:-}
      # Generated and persisted under /data on first boot if unset. Rotating
      # it signs everyone out.
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      # ⚠️ Both of these are OFF by default upstream and stay off here.
      # See .env.example and README for what each one opens up.
      - EXECUTOR_ALLOW_LOCAL_NETWORK=${EXECUTOR_ALLOW_LOCAL_NETWORK:-false}
      - EXECUTOR_ALLOW_STDIO_MCP=${EXECUTOR_ALLOW_STDIO_MCP:-}
      - EXECUTOR_ORG_NAME=${EXECUTOR_ORG_NAME:-Default}
      - EXECUTOR_ORG_SLUG=${EXECUTOR_ORG_SLUG:-default}
      # Headless admin creation, for a deploy that should not stop at a
      # browser setup screen. Leave unset for the in-browser first-run flow.
      - EXECUTOR_BOOTSTRAP_ADMIN_EMAIL=${EXECUTOR_BOOTSTRAP_ADMIN_EMAIL:-}
      - EXECUTOR_BOOTSTRAP_ADMIN_PASSWORD=${EXECUTOR_BOOTSTRAP_ADMIN_PASSWORD:-}
      - EXECUTOR_BOOTSTRAP_ADMIN_NAME=${EXECUTOR_BOOTSTRAP_ADMIN_NAME:-Admin}
    ports:
      # Published on all interfaces by default, matching llm-gateways.
      #
      # That is a deliberate choice, not an oversight: the point of Executor
      # is that OTHER CONTAINERS reach it, and they do so through
      # host.docker.internal — which resolves to a host-gateway address, not
      # to the host's loopback. Binding to 127.0.0.1 would make it
      # unreachable from exactly the agents it exists to serve.
      #
      # What protects it is Executor's own gate: the first account created
      # becomes owner and self-service signup then CLOSES, so there is no
      # window in which an unauthenticated stranger can use it — unlike a
      # service whose auth is opt-in. Set EXECUTOR_BIND_ADDRESS=127.0.0.1 if
      # only host processes need it.
      - "${EXECUTOR_BIND_ADDRESS:-0.0.0.0}:${EXECUTOR_PORT:-4788}:4788"
    volumes:
      # A named volume on a DIRECTORY — the safe shape; the OrbStack failure
      # in docs/lessons-learned/nanoclaw-mnemon.md was a single-FILE mount.
      #
      # The image sets EXECUTOR_DATA_DIR=/data and declares VOLUME ["/data"].
      # It holds the SQLite database AND the generated secret-encryption key:
      # LOSING THIS VOLUME LOSES EVERY STORED CREDENTIAL, and they are not
      # recoverable from anywhere else.
      - "executor_data:/data"
    healthcheck:
      # Upstream's own check, from apps/host-selfhost/docker-compose.yml.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:4788/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  executor_data:
    name: ${CONTAINER_NAME:-executor}_data
