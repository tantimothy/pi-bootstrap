menu:
  id: sheepshaver
  name: "SheepShaver"
  icon: utilities-terminal
deployed_check:
  # The container runs with --rm, so a lingering image alone doesn't prove
  # it was ever launched — run.sh touches .deployed right before it runs.
  kind: marker
  value: "${ENV_DIR}/.deployed"
entries:
  - id: pi-bootstrap-sheepshaver
    name: "SheepShaver (Mac OS 9)"
    comment: "PowerPC Classic Mac OS emulator — builds/launches in a privileged, X11-forwarded container"
    icon: utilities-terminal
    kind: exec
    target: 'bash -c "cd ''${ENV_DIR}'' && REBUILD_POLICY=FAST ./run.sh"'
    terminal: true
info:
  id: pi-bootstrap-sheepshaver-info
  name: "SheepShaver Info"
