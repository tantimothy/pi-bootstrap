# _yaml_expand doesn't support nested ${VAR:-${OTHER}} markers (see
# docs/environment-yaml-schemas.md) — these list the default SS_DATA_PATH/
# SS_EXTFS locations (matching run.sh's own defaults) rather than trying to
# reflect a .env override here. If you've pointed SS_DATA_PATH/SS_EXTFS
# elsewhere, this listing (and WIPE) won't follow it.
data_dirs:
  - path: "${SCRIPT_DIR}/data"
    description: "SheepShaver ROM, hard disk image, and config (bind-mounted to /data in the container) — default SS_DATA_PATH"
  - path: "${SCRIPT_DIR}/shared"
    description: "Host folder shared with the emulated Mac as an extra drive — default SS_EXTFS"
install_dirs: []
named_volumes: []
no_data_msg: "(none — run FAST at least once to create the data/shared directories)"
delete_confirm_msg: "This deletes your Mac ROM, hard disk image (and everything installed inside it), and the shared folder's contents."
useful_commands: |2
     docker build -t ${DOCKER_IMAGE_TAG:-pi-bootstrap-sheepshaver} ${SCRIPT_DIR}   # Rebuild the image manually
     docker run --rm -it --entrypoint bash ${DOCKER_IMAGE_TAG:-pi-bootstrap-sheepshaver}   # Shell into the image (no ROM/disk needed)
     ls ${SCRIPT_DIR}/data                                            # Your ROM/disk/config (default SS_DATA_PATH)
     ls ${SCRIPT_DIR}/shared                                          # Files shared with the emulated Mac (default SS_EXTFS)

     📌 Notes:
     SheepShaver needs a pre-2000 Macintosh ROM — see README.md for where to find one.
     Create the hard disk image through SheepShaver's own GUI on first run, then set SS_NO_GUI=true in .env.
