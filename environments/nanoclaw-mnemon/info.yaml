data_dirs:
  - path: "${NANOCLAW_INSTALL_PATH:-/home/pi/nanoclaw-mnemon}/groups"
    description: "Per-group files: conversation history, transcripts, and CLAUDE.md; Mnemon memory graphs are also here when NANOCLAW_SETUP=mnemon"
  - path: "${NANOCLAW_INSTALL_PATH:-/home/pi/nanoclaw-mnemon}/data"
    description: "Sessions, message DB, task scheduler DB, IPC streams"
install_dirs:
  - path: "${NANOCLAW_INSTALL_PATH:-/home/pi/nanoclaw-mnemon}"
    description: "NanoClaw repo/binaries (groups/ and data/ live inside here)"
data_dirs_label: "📁 Persistent Data Directories (back these up):"
install_dirs_label: "📂 Install Directories (can be re-cloned by CLEAN):"
delete_install_dirs: false
delete_confirm_msg: "All conversation history and any Mnemon persistent memory graph will be lost."
# NanoClaw itself still has no default web interface of its own — its own
# README says so directly ("Beyond setup there's no monitoring dashboard or
# debugging UI either: describe the problem in chat"). NANOCLAW_PORT exists
# only to pre-reserve a port on the container in case you later add its
# optional `/add-dashboard` skill (a separate npm package, its own
# DASHBOARD_PORT/DASHBOARD_SECRET, not wired to this variable at all) — it
# was previously advertised here as a working URL, which it never was. This
# environment no longer bundles Open WebUI either (see the standalone
# `chat-frontends` environment instead) — so there's genuinely no web UI here.
web_uis: []
custom_actions:
  - label: "Manage Codex Provider"
    command: "bash ${ENV_DIR}/scripts/manage-codex-provider.sh"
  - label: "Scaffold a Wiki for a Group (Mnemon profile)"
    command: 'read -rp "Group folder name (under groups/): " GROUP; bash ${ENV_DIR}/scripts/scaffold-wiki.sh "$GROUP"'
  - label: "Reload Mnemon for a Group (Mnemon profile)"
    command: "bash ${ENV_DIR}/scripts/reload-mnemon.sh"
  - label: "Check / Restart Ollama"
    command: "bash ${PROJECT_DIR}/ollama-watchdog.sh"
  # Opens a persistent, detachable tmux "claude" session directly inside
  # THIS environment's own orchestrator container (see scripts/claude-tmux.sh
  # — same grouped-session pattern as the standalone claude-cli environment,
  # so a second simultaneous `docker exec` connection gets its own window
  # instead of hijacking this one's). Deliberately lands in /root, NOT
  # $NANOCLAW_INSTALL_PATH (unlike the useful_commands entry below) —
  # confirmed directly against a real, already-in-use deploy: Claude Code's
  # own conversation continuity is scoped to the exact launch directory, and
  # the container's real, already-existing admin conversation history lives
  # under /root (this container runs as root, with no explicit WORKDIR set,
  # so a plain `docker exec -it ... bash` — how that conversation was
  # originally started, before this menu action existed — lands there by
  # default). Landing this action anywhere else would silently start a
  # second, parallel conversation instead of resuming the real one, or fail
  # with Claude Code's own "This conversation is from a different directory"
  # error if you then tried `--continue`/`--resume` from here expecting it
  # to find that history. If you've never used this container's admin
  # `claude` session before (no /root history exists yet), this just
  # starts a fresh one there instead — same as it would anywhere else.
  # Three session actions, deliberately separate rather than one with a
  # prompt. Claude Code scopes conversation continuity to the exact launch
  # DIRECTORY, so these are three genuinely different conversations, and each
  # gets its own tmux session name — sharing one would silently land a
  # connection in the wrong directory with the wrong history.
  - label: "Open a Claude Session (/root — admin history)"
    command: 'docker exec -it ${CONTAINER_NAME:-nanoclaw-mnemon} bash -lc "nanoclaw-claude-tmux.sh claude /root"'
  - label: "Open a Claude Session (NanoClaw source tree)"
    command: 'docker exec -it ${CONTAINER_NAME:-nanoclaw-mnemon} bash -lc "nanoclaw-claude-tmux.sh claude-install ${NANOCLAW_INSTALL_PATH:-$HOME/nanoclaw-mnemon}"'
  # Runs on the HOST, not in the orchestrator: picking the target container
  # needs `docker ps`. This is the one that reaches whisper-cli, mnemon's real
  # data, and the baked ENVs — i.e. where nearly every investigation in this
  # environment's history actually had to end up.
  - label: "Open a Claude Session (most recent agent container)"
    command: "bash ${ENV_DIR}/scripts/open-agent-session.sh"
  # Which model that admin `claude` session launches with — see
  # scripts/choose-model.sh and .env.example's own CLAUDE_MODEL comment.
  # Does NOT affect per-conversation-group agent containers (NanoClaw's own
  # separate concern — see the README's "Can NanoClaw Itself Talk to
  # Ollama?" section).
  - label: "Choose Claude Model"
    command: "bash ${ENV_DIR}/scripts/choose-model.sh"
# |2 pins the strip to exactly 2 spaces regardless of which line is
# least-indented — "📌 Notes:" is intentionally at column 0 in the
# rendered output; see ntopng/info.yaml for the full explanation. The
# $NANOCLAW_INSTALL_PATH references below are deliberately NOT ${...}
# markers — they're meant to stay literal, evaluated by the container's own
# shell when the user runs the command, not substituted by this script.
useful_commands: |2
     docker ps --filter name=nanoclaw-mnemon                         # Orchestrator status
     docker logs -f nanoclaw-mnemon                                  # Orchestrator live logs
     docker restart nanoclaw-mnemon                                  # Restart after a config change
     docker ps --filter name=nanoclaw-agent                          # List this install's agent containers
     docker exec -it nanoclaw-mnemon bash -lc "cd /root && nanoclaw-claude-tmux.sh"   # Then: /add-telegram, /add-whatsapp, /add-discord, etc. (see README's "Adding Channels", and "Launching Claude CLI Directly" for why /root)
     docker exec -it nanoclaw-mnemon tmux attach -t claude              # Reattach to the admin claude session directly, no relaunch wrapper
     docker exec -it nanoclaw-mnemon bash -lc "cd $NANOCLAW_INSTALL_PATH && bash setup/register-claude-token.sh"   # Update Anthropic API key
     bash environments/nanoclaw-mnemon/scripts/manage-codex-provider.sh  # Authenticate/switch/diagnose optional Codex provider
     ollama pull llama3.2                                              # Optional: pull a chat model; Mnemon embeddings use nomic-embed-text

  📌 Notes:
     🧠 Mnemon-specific actions and memory apply only when NANOCLAW_SETUP=mnemon
        (the default). Set NANOCLAW_SETUP=plain for an unpatched NanoClaw agent image.
     🤖 NANOCLAW_INSTALL_CODEX=true prepares Codex during CLEAN without OAuth
        or switching groups. Finish setup later through "Manage Codex Provider".
        Provider wiring/CLIs are restored on each CLEAN; OAuth stays in OneCLI's
        external vault, and group/default/task/session state stays under the
        preserved NanoClaw install path.
     🐳 NanoClaw manages its own Docker containers per conversation group.
        Use the Docker Manager in the deploy menu to view or delete them.
     ❌ iMessage isn't offered — this environment is container-mode only (see
        the README's "Deployment Modes" section for why).
     🌐 Want a chat UI for Ollama? See the standalone `chat-frontends` environment
        instead — this environment no longer bundles one of its own.
     🖥️ "Open a Claude Session (...)" — three of them in this environment's
        own deploy.sh menu. /root holds the admin conversation history;
        the NanoClaw source tree is for working on the install itself; the
        agent-container one reaches whisper-cli, mnemon's real data and the
        baked ENVs, which is where most debugging actually has to happen.
        Separate directories mean separate Claude conversations, by design.
        The first two attach to this environment's own orchestrator container
        via `docker exec -it`, into a persistent tmux "claude" session —
        alongside NanoClaw's own chat-platform conversation, no separate SSH
        server needed. Multiple simultaneous connections each get their own
        tmux window grouped onto that same session (see claude-tmux.sh).
     🧠 Which model that admin session's `claude` launches with: unset
        (default) lets Claude Code pick its own default, or pin one via
        "Choose Claude Model" above / CLAUDE_MODEL in .env. Per-conversation-
        group agent containers are unaffected — see the README.
