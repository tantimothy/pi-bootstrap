data_dirs: []
install_dirs:
  - path: "${HOME}/bin"
    description: "Bundled whimsy scripts (whimsy-splash, whimsy-menu, bofhexcuse, insulthost.pl, piratehost.pl, calendar data, TalkingMoose phrases) plus hollywood.d, bb.d, aalib.d and libcaca.d — the fetched and compiled splashes. Only present if whimsy extras are enabled; bb.d is most of the size, being a source checkout"
no_data_msg: "(none — mac-terminal-setup only installs packages and configures dotfiles)"
no_delete_msg: "mac-terminal-setup has no persistent data directories to delete.\n   Existing dotfiles it overwrote are backed up under ${HOME}/.pi-bootstrap-backups/ —\n   restore one by copying it back from the most recent mac-terminal-setup-* folder there.\n   To undo package installations, remove them manually with:\n   brew uninstall <formula>"
custom_actions:
  - label: "Launch a whimsy splash..."
    command: 'bash ${ENV_DIR}/bin/whimsy-menu'
  - label: "Toggle whimsical login extras"
    command: 'CUR="${WHIMSY_ENABLED:-false}"; if [ "$CUR" = "true" ]; then NEW=false; else NEW=true; fi; echo "Whimsical login extras are currently: $CUR"; read -rp "Switch to $NEW instead? [y/N]: " ANSWER; if [[ "$ANSWER" =~ ^[Yy] ]]; then echo "WHIMSY_ENABLED=$NEW" > ${ENV_DIR}/.env; echo "Whimsy extras now: $NEW — applying..."; bash ${ENV_DIR}/run.sh; else echo "No changes made."; fi'
# |2 pins the strip to exactly 2 spaces regardless of which line is
# least-indented — see ntopng/info.yaml for the full explanation.
# ~/.bashrc and ~/bin below are literal tildes, not ${HOME} — informational
# text for the user to type themselves.
useful_commands: |2
     cat ${SCRIPT_DIR}/.env                                            # Current whimsy on/off setting
     ~/bin/whimsy-menu                                                 # Pick a splash to launch (same TUI as the action below)
     ~/bin/whimsy-splash --list                                        # Every splash, with what each one does
     ~/bin/whimsy-splash hollywood                                     # Launch one by name (see --list for the ids)
     ./run.sh                                                          # Re-run setup; rebuilds bb/aalib/libcaca as needed
     ~/bin/install-bb --force                                          # Rebuild bb from source, ignoring a past failure
     ~/bin/install-aalib --force                                       # Rebuild aalib with a real terminal driver
     ~/bin/install-libcaca --force                                     # Rebuild libcaca's cacafire and cacademo
     cat ~/bin/bb.d/build.log                                          # Why the last bb build did what it did
     cat ~/bin/aalib.d/build.log                                       # Same, for aalib
     cat ~/bin/libcaca.d/build.log                                     # Same, for libcaca
     grep -A3 'MAC TERMINAL PROMPT START' ~/.bashrc                    # View injected .bashrc blocks
     grep -A3 'MAC TERMINAL WHIMSY START' ~/.bashrc
     source ~/.bash_profile                                            # Reload shell config
     tmux ls                                                           # List active tmux sessions
     tmux attach                                                       # Attach to most recent tmux session
     brew list --formula                                               # All installed Homebrew packages
     ls -t ~/.pi-bootstrap-backups/ | head                             # Most recent backups from this environment

  📌 Notes:
     🔑 Host-only — installs packages/dotfiles directly on macOS, no
        container or service runs, so there's nothing to STOP/TEARDOWN.
     🔑 Whimsical login extras (fortune-style sign-offs) default off;
        toggle them with this environment's own menu action. A new shell
        then opens with one splash picked at random out of fifteen. The
        menu lists seventeen — two more that it offers but the random pick
        never chooses, marked [menu] there.
     🔑 bb, aalib and libcaca are compiled from source (nothing packages
        them for macOS), so they're the pieces that can need a rebuild.
        FAST does it automatically when something changed; --force is for
        retrying a build that failed. Rebuild aalib before bb — bb renders
        through whichever aalib it was linked against. libcaca is
        independent of both.
     🔑 Full details: environments/mac-terminal-setup/README.md
