data_dirs: []
install_dirs: []
named_volumes: []
no_data_msg: "(Ollama stores downloaded models under ~/.ollama, but this host setup does not claim or delete that shared state.)"
no_delete_msg: "TEARDOWN removes the recognized Ollama runtime but preserves downloaded models. Use the Delete an Installed Model action to remove one model safely; this environment never bulk-deletes ~/.ollama or /usr/share/ollama."
web_uis: []
custom_actions:
  - label: "List Installed Models"
    command: "bash ${ENV_DIR}/scripts/manage-models.sh --list-installed"
  - label: "List Running Models"
    command: "bash ${ENV_DIR}/scripts/manage-models.sh --list-running"
  - label: "Show Host Resources / Model RAM"
    command: "bash ${ENV_DIR}/scripts/manage-models.sh --resources"
  - label: "Stop a Running Model"
    command: "bash ${ENV_DIR}/scripts/manage-models.sh --stop"
  - label: "Delete an Installed Model"
    command: "bash ${ENV_DIR}/scripts/manage-models.sh --delete"
  - label: "Pull a Recommended Model"
    command: "bash ${ENV_DIR}/scripts/manage-models.sh --pull"
  - label: "Run an Installed Model"
    command: "bash ${ENV_DIR}/scripts/manage-models.sh --run"
  - label: "Check / Restart Ollama"
    command: "bash ${PROJECT_DIR}/ollama-watchdog.sh"
useful_commands: |2
     ollama list                                                        # Models installed on disk
     ollama ps                                                          # Models currently loaded in RAM
     bash ${SCRIPT_DIR}/scripts/manage-models.sh                         # Full interactive model manager
     bash ${SCRIPT_DIR}/scripts/manage-models.sh --resources             # Host RAM/CPU/disk and loaded-model usage
     bash ${PROJECT_DIR}/ollama-watchdog.sh --check                      # API health check
     bash ${PROJECT_DIR}/ollama-watchdog.sh --restart                    # Force a daemon restart

  📌 Notes:
     🦙 Ollama runs natively on the host and is shared by NanoClaw Mnemon,
        chat frontends, LLM gateways, and any direct API clients.
     🧹 STOP pauses that shared daemon. TEARDOWN/CLEAN remove or reinstall the
        recognized runtime while preserving every downloaded model.
     📊 Pull recommendations come from the supplied local-LLM/wiki articles.
        Assessments combine working-RAM estimates with macOS memory pressure
        or Linux PSI. They remain guidance: context length, parallel requests,
        quantization, and Ollama version all matter.
     🧠 nomic-embed-text is included for Mnemon semantic recall. It generates
        embeddings only and cannot be used as an interactive chat model.
