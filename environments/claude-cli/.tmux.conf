# Same config as pi-barebones/.tmux.conf — copied, not shared at runtime,
# matching this repo's convention that every environment is self-contained.
# Paired with the grouped-session launch pattern (see bashrc-tmux-attach.sh /
# open-claude-session.sh in this same directory) so multiple simultaneous
# SSH/docker-exec connections each get their own current-window view into
# the same underlying tmux session, instead of every client being forced
# to watch whichever window the most recent one switched to.

# --- Escape key latency ---
# tmux waits escape-time milliseconds after a lone Escape byte (0x1b)
# before deciding it is a real Escape and not the start of an arrow key,
# function key, or other \e[... sequence. The default is 500, so every Esc
# inside this session — in the agent CLI itself, in vim, in any ncurses TUI
# — sits idle for half a second before the application even learns a key
# was pressed. Ctrl-C feels instant next to it because it is an unambiguous
# single byte that the tty turns straight into SIGINT, with nothing to
# disambiguate and nothing to wait for.
#
# This tmux runs *inside the container*, so its wait stacks on top of
# whatever the host's own tmux adds on the way in and whatever the
# application itself adds once the byte finally arrives (ncurses' ESCDELAY,
# default a full 1000ms — see lib/locale-lib.sh for the host-side half of
# the same fix). Lowering any one layer leaves the others fully intact.
#
# 10ms rather than 0: across an ssh hop and a docker attach, the bytes of a
# genuine "\e[A" can arrive split across reads, and a zero timeout turns an
# arrow key into Escape followed by a literal "[A" typed into whatever is
# running. 10ms is imperceptible and still leaves the sequence intact.
set -s escape-time 10

# --- Equivalent of: caption always %{ Mk}%-w%{ Wk}%n %t%{ Mk}%+w ---
# Enable status bar
set -g status on
set -g status-position bottom
set -g status-style fg=white,bg=black # Default colors (Wk)

# Window list format (equivalent to %-w%n %t%+w)
set-window-option -g window-status-format "#[fg=magenta,bg=black] #I #W "
# Current window format (highlighted)
set-window-option -g window-status-current-format "#[fg=white,bg=magenta,bold] #I #W "

# --- Equivalent of: shelltitle $ |bash ---
# Automatic title renaming based on active process
#set-window-option -g automatic-rename on
#set-window-option -g automatic-rename-format "#{pane_current_command}"

# ---

set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_current_command}"

# Enable automatic renaming by programs within panes
set-window-option -g automatic-rename on
set-option -g allow-rename on

# Set the automatic window name format to list pane information
# The format uses tmux variables like #{pane_index} and #{pane_current_command}

set-window-option -g automatic-rename-format "#{P:#{pane_index}-#{pane_current_command} } (#P)"

# Change pane colors
set -g pane-active-border fg=black
set -ag pane-active-border bg=white

# Reload .tmus.conf
# C-b r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Create new window with current path
# C-b c
bind c new-window -c "#{pane_current_path}"

# Toggling Windows and Sessions
# C-b <space>
# bind Space last-window

# Resizing
# C-b C-i / C-b C-j / C-b C-k / C-b C-l
bind -r C-k resize-pane -D 15
bind -r C-i resize-pane -U 15
bind -r C-j resize-pane -L 15
bind -r C-l resize-pane -R 15

# Breaking and Joining Panes
# C-b j
bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'
